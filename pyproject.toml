[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archimind-ai"
version = "0.1.0"
description = "ArchiMind AI: Evidence-grounded System Design Knowledge Assistant using RAG"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sentence-transformers>=2.5.0",
    "torch>=2.0.0",
    "pgvector>=0.2.5",
    "psycopg[binary]>=3.1.18",
    "sqlalchemy>=2.0.28",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "langsmith>=0.1.0",
    "numpy>=1.24.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
